<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Register</h1>

        <div id="message"></div>

        <form id="registerForm">

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    required
                >
            </div>

            <button class="btn">
                Register
            </button>

        </form>

        <div class="link">
            <a href="login.html">
                Already Have Account?
            </a>
        </div>

    </div>

</div>

<script src="js/register.js"></script>

</body>
</html>
