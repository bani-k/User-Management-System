<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">

    <h2>Student Management</h2>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">My Profile</a>
        <a href="students.html">Students</a>
        <a href="add-student.html">Add Student</a>
        <a href="#" id="logoutBtn">Logout</a>
    </div>

</nav>

<div class="container">

<div class="card">

<h2>Add Student</h2>

<form id="studentForm">

<input type="text"
id="studentId"
placeholder="Student ID"
required>

<br><br>

<input type="text"
id="firstName"
placeholder="First Name"
required>

<br><br>

<input type="text"
id="lastName"
placeholder="Last Name"
required>

<br><br>

<input type="email"
id="email"
placeholder="Email"
required>

<br><br>

<input type="text"
id="phone"
placeholder="Phone">

<br><br>

<input type="text"
id="course"
placeholder="Course"
required>

<br><br>

<input type="number"
id="semester"
placeholder="Semester"
required>

<br><br>

<input type="text"
id="address"
placeholder="Address">

<br><br>

<button class="btn">
Add Student
</button>

</form>

</div>

</div>

<script src="js/add-student.js"></script>

</body>
</html>
