<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Login</h1>

        <div id="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    required
                >
            </div>

            <button class="btn">
                Login
            </button>

        </form>

        <div class="link">
            <a href="register.html">
                Create Account
            </a>
        </div>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
