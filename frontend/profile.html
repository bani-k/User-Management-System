<div class="container">

<div class="card">

<h2>
My Profile
</h2>

<br>

<form id="profileForm">

<input
type="text"
id="username">

<br><br>

<input
type="email"
id="email"
disabled>

<br><br>

<button
class="btn">

Update Profile

</button>

</form>

<hr>

<br>

<h3>
Change Password
</h3>

<br>

<form id="passwordForm">

<input
type="password"
id="currentPassword"
placeholder="Current Password">

<br><br>

<input
type="password"
id="newPassword"
placeholder="New Password">

<br><br>

<button
class="btn">

Change Password

</button>

</form>

</div>

</div>

<script src="js/profile.js"></script>

</body>
</html>
